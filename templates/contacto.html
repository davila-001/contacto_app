{% extends "base.html" %}

{% block content %}
<h2>Contáctanos</h2>
<form method="POST">
    <label>Nombre:</label>
    <input type="text" name="nombre" required>
    
    <label>Correo electrónico:</label>
    <input type="email" name="correo" required>
    
    <label>Mensaje:</label>
    <textarea name="mensaje" required></textarea>
    
    <button type="submit">Enviar</button>
</form>
{% endblock %}
